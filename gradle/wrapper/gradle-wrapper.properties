distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
# Retry a failed distribution download rather than failing the whole build on a flaky
# connection. The wrapper is validated against Gradle's published checksum
# (.github/workflows/android.yml), so retrying cannot substitute a different artifact.
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
