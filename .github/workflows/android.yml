name: Android CI

# Roadmap F10. Two jobs:
#   build       - unit tests, lint, debug + release (R8) assembly. Fast, always run.
#   instrumented - the Compose UI tests, which need a booted emulator. Slower.
#
# This workflow deliberately does NOT use the repo's .toolchain/ directory: that
# is a per-machine, gitignored install, and tools/android-env.sh is a no-op
# without it (see README), so the runner's own JDK and Android SDK are used.

# Nightly, and on demand before a release (RELEASING.md step 1). Deliberately **not** on every push:
# the instrumented job's emulator is the one piece of infrastructure here that has failed without a test
# running, so a per-push run would mostly report on the runner rather than on the change. The per-change
# guard is the local gate set in AGENTS.md, which is the same set the build job runs.
on:
  schedule:
    # 05:17 UTC. Not on the hour: that is when every scheduled job on GitHub starts, and the runners
    # queue behind each other.
    - cron: '17 5 * * *'
  workflow_dispatch:

# A rerun of the same kind supersedes its predecessor, and the event name is part of the group so that a
# dispatch before a release cannot cancel the nightly run or the other way round. The one time this cost
# something, a documentation push cancelled an instrumented run twenty minutes in, and the result was a
# cancelled job whose summary looked exactly like an infrastructure failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint, detekt, R8
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk and the build-tools version are pinned in app/build.gradle.kts,
      # so they are requested explicitly rather than left to AGP's auto-download —
      # a missing platform then fails with "package not found" instead of a
      # confusing resource-linking error.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # F18. Verifies gradle-wrapper.jar against the checksum Gradle publishes, so a
      # tampered wrapper cannot ride in on a pull request. Cheap, and nothing else
      # in this workflow would notice.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Lint covers Android-specific issues and fails on any warning
      # (warningsAsErrors); detekt adds complexity checks and the Compose ruleset,
      # pinned to a detekt-1.x-compatible version in gradle/libs.versions.toml because
      # a mismatched one loads silently and catches nothing. The release assembly has
      # no signing config in CI, so it produces an unsigned APK — which is the point:
      # it proves R8 shrinking succeeds on every change.
      #
      # B12. One invocation, not five: each separate ./gradlew call pays its own
      # configuration, and measured on this checkout five calls cost a little over
      # twice what one call naming all five tasks costs. The configuration cache is
      # on because this build supports it (AGP 9, Hilt and KSP included).
      - name: Unit tests, lint, detekt, debug and R8
        run: >
          ./gradlew
          testDebugUnitTest
          lint
          detekt
          assembleDebug
          assembleRelease
          --configuration-cache
          --console=plain

      # F18. Gradle prints only "There were failing tests" with --console=plain; the
      # names live in the JUnit XML. Without this a red run says nothing about what
      # broke — which cost real time here twice.
      - name: Summarise failing tests
        if: failure()
        run: python3 tools/ci-summarise-failures.py





      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/detekt
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore

      # Without this, an obfuscated release crash trace is unreadable.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    # Runs with the workflow now: nightly, and on a dispatch before a release. It is no longer gated to
    # a manual dispatch, which is the change N30 was waiting for — the emulator gets exercised on a
    # schedule, so a regression in this job is found by the pipeline rather than by whoever remembers to
    # ask. Nothing is cancelled by it, because no push starts a run any more.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # N30, and the answer to a year of flakiness. `/dev/kvm` *is* present on the hosted runner — the
      # emulator's own probe says so and names the problem: "This user doesn't have permissions to use KVM
      # (/dev/kvm). The KVM line in /etc/group is: [kvm:x:993:]". The device is there and the group exists;
      # the runner user is simply not in it. Without this step the emulator falls back to software emulation
      # ("Disabling Linux hardware acceleration"), which is what produced every signature this job has failed
      # with: a sixteen-minute boot, an adb connection that dies the moment tests start, and — most recently —
      # a device that booted and then could not answer `getprop`, so AGP skipped it as "Unknown API Level" and
      # the suite ran nothing at all.
      #
      # Documented by GitHub for the hosted runners, and by the emulator action itself:
      # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The slowest and most environment-sensitive job here, and the only one that has failed on
      # infrastructure rather than on a test. The hosted runner has no hardware acceleration, so a boot
      # takes minutes, and it has now gone red without a test running three times, with three different
      # signatures: a corrupt system-image download ("Error on ZipFile unknown archive"), a boot that
      # outran the default 600 s timeout, and an emulator that booted and then died — the runner's own
      # adb emulator-kill failing while the job's failure summary printed no failing tests.
      #
      # The boot timeout was raised for the second of those. The third is why this job no longer runs on
      # every push: for a while it was gated to a manual dispatch, and it now runs nightly instead, which
      # keeps it exercised without letting a runner problem read as a verdict on a change. The suite also
      # runs locally on a device, where it passes.
      #
      # N30. The lever this step was waiting for turned out to be pulled already: the flags the suite
      # uses locally are the action's own defaults, so "try the emulator's options" could not have been
      # the fix, and this run is not the experiment the roadmap expected. Checking the pinned action's
      # action.yml is what settled it — its default is exactly
      # `-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim`, which is what the
      # absence of this key meant. They are set here anyway, explicitly, for two reasons: the workflow
      # then owns the flags it depends on rather than inheriting them, and a future bump of the action's
      # SHA cannot change how the emulator boots without this file saying so.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # N30. The boot is what fails here: a nightly run on this image logged "Boot completed in
          # 990222 ms" — sixteen and a half minutes — and the emulator's adb connection died
          # immediately afterwards ("Failure calling service settings: Broken pipe"), before a single
          # test ran. More minutes to boot is more time for a starved runner to lose the emulator.
          #
          # N30. The API-level trade this comment used to carry is now split by trigger rather than
          # paid on every run. `aosp_atd` is an Automated Test Device, built for exactly this and
          # without the Google services this app does not use at runtime, and it stops at API 34 —
          # so the nightly keeps it, because a suite that runs every night must not be slow for a
          # reason nobody is testing that night. The pre-release dispatch runs at the API the app
          # ships against, which is where a change in API 35+ behaviour can actually show up.
          #
          # The image for the shipping API is the one thing not verified here: if none is published,
          # the dispatch fails at download. Pick the highest API that is published, change the number
          # below, and record why it is not the shipping API in DECISIONS-EVIDENCE.md.
          api-level: ${{ github.event_name == 'workflow_dispatch' && 37 || 34 }}
          target: ${{ github.event_name == 'workflow_dispatch' && 'default' || 'aosp_atd' }}
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          # `-accel auto`, not the action's default, because the default now resolves to hardware
          # acceleration (the KVM step above is what makes it available) and this file should say which
          # way it goes rather than inherit it. `-gpu swiftshader_indirect` stays: GPU acceleration needs a
          # host GPU the runner does not have, and that is a different lever from VM acceleration.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          script: ./gradlew connectedDebugAndroidTest --console=plain

      # B8. A green run whose XML records fewer tests than the source declares is the
      # failure this job is least able to notice: no failures, no skipped tests, just a
      # short report. This compares the two counts and fails when they differ.
      - name: Every declared test executed
        if: always()
        run: python3 tools/ci-check-instrumented.py

      # F18. Gradle prints only "There were failing tests" with --console=plain; the
      # names live in the JUnit XML. Without this a red run says nothing about what
      # broke — which cost real time here twice.
      - name: Summarise failing tests
        if: failure()
        run: python3 tools/ci-summarise-failures.py

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
