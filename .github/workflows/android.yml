name: Android CI

# Roadmap F10. Two jobs:
#   build       - unit tests, lint, debug + release (R8) assembly. Fast, always run.
#   instrumented - the Compose UI tests, which need a booted emulator. Slower.
#
# This workflow deliberately does NOT use the repo's .toolchain/ directory: that
# is a per-machine, gitignored install, and tools/android-env.sh is a no-op
# without it (see README), so the runner's own JDK and Android SDK are used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint, detekt, R8
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk and the build-tools version are pinned in app/build.gradle.kts,
      # so they are requested explicitly rather than left to AGP's auto-download —
      # a missing platform then fails with "package not found" instead of a
      # confusing resource-linking error.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # F18. Verifies gradle-wrapper.jar against the checksum Gradle publishes, so a
      # tampered wrapper cannot ride in on a pull request. Cheap, and nothing else
      # in this workflow would notice.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # F18. Gradle prints only "There were failing tests" with --console=plain; the
      # names live in the JUnit XML. Without this a red run says nothing about what
      # broke — which cost real time here twice.
      - name: Summarise failing tests
        if: failure()
        run: python3 tools/ci-summarise-failures.py

      # Fails on any lint warning: warningsAsErrors is set in app/build.gradle.kts.
      - name: Lint
        run: ./gradlew lint --console=plain

      # Lint covers Android-specific issues; detekt adds complexity checks and the
      # Compose ruleset. The Compose rules are pinned to a detekt-1.x-compatible
      # version in gradle/libs.versions.toml — a mismatched one loads silently and
      # catches nothing.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      # No signing config is present in CI, so this produces an unsigned APK.
      # That is the point: it proves R8 shrinking succeeds on every change.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/detekt
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore

      # Without this, an obfuscated release crash trace is unreadable.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The slowest and most environment-sensitive job here, and the only one that
      # has failed on infrastructure rather than on a test. The hosted Linux runner
      # has no hardware acceleration, so a boot takes minutes: twice now the job has
      # gone red without a test running — once on a corrupt system-image download
      # ("Error on ZipFile unknown archive"), once on a boot that outran the default
      # 600 s timeout. The timeout is raised rather than the job hidden; if it proves
      # flaky again, move it behind workflow_dispatch rather than deleting it, so the
      # tests still exist.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --console=plain

      # F18. Gradle prints only "There were failing tests" with --console=plain; the
      # names live in the JUnit XML. Without this a red run says nothing about what
      # broke — which cost real time here twice.
      - name: Summarise failing tests
        if: failure()
        run: python3 tools/ci-summarise-failures.py

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
