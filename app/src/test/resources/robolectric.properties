# Robolectric's simulated device (ROADMAP P1.17).
#
# Pinned deliberately: the app's targetSdk is 37, which Robolectric 4.15.1 does not
# support yet, so without this every test fails with "Unsupported SDK". 35 is the
# newest it does support, and these tests only exercise Compose semantics and
# layout, which do not differ across these levels.
sdk=35
