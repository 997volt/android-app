# Single source of truth for the app's version (ROADMAP F14).
#
# Kept out of build.gradle.kts so a release bump is one edit in one file, and so
# tooling or CI can rewrite it without patching Kotlin. The build reads both
# values and fails loudly if either is missing, rather than silently shipping a
# default.
versionCode=1
versionName=1.0
